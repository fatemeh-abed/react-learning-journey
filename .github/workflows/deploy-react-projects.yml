name: Deploy React Projects

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Eat-n-Split
        working-directory: eat-n-split
        run: |
          npm ci
          npm run build

      - name: Build Pizza Menu
        working-directory: pizza-menu
        run: |
          npm ci
          npm run build

      - name: Build Steps
        working-directory: steps
        run: |
          npm ci
          npm run build

      - name: Build Travel List
        working-directory: travel-list
        run: |
          npm ci
          npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/eat-n-split
          mkdir -p site/pizza-menu
          mkdir -p site/steps
          mkdir -p site/travel-list

          cp -R eat-n-split/build/. site/eat-n-split/
          cp -R pizza-menu/build/. site/pizza-menu/
          cp -R steps/build/. site/steps/
          cp -R travel-list/build/. site/travel-list/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
